<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Города России — статистика</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <aside class="sidebar">
    <h2>
  <a href="index.html" class="russia-btn">
    <span class="icon">⭐</span>
    Россия
  </a>
</h2>

    <ul>
        <li><a href="overview.html">Обзор</a></li>
        <li><a href="big.html">Крупные города</a></li>
        <li><a href="small.html">Малые города</a></li>
    </ul>
  </aside>

  <main class="dashboard">
    <header>
      <h1>Население городов России</h1>
    </header>

    <!-- КАРТОЧКИ -->
    <section class="cards">
      <div class="card">
        <h3>Россия</h3>
        <p class="big" id="russiaPopulation">Загрузка...</p>
        <span>Население </span>
      </div>

      <div class="card">
        <h3>Москва</h3>
        <p class="big">13,1 млн</p>
        <span>Крупнейший город</span>
      </div>

      <div class="card">
        <h3>Санкт-Петербург</h3>
        <p class="big">5,6 млн</p>
        <span>Второй по населению</span>
      </div>
    </section>

    <!-- ГРАФИКИ -->
    <section class="charts">
      <div class="chart-box">
        <h3>Города-миллионники</h3>
        <canvas id="millionChart"></canvas>
      </div>

      <div class="chart-box">
        <h3>Контраст: мегаполис → малый город</h3>
        <canvas id="compareChart"></canvas>
      </div>
    </section>
  </main>

  <!-- ГРАФИКИ -->
  <script>
    new Chart(document.getElementById('millionChart'), {
      type: 'bar',
      data: {
        labels: ['Москва', 'СПб', 'Новосибирск', 'Екатеринбург', 'Казань', 'Нижний Новгород'],
        datasets: [{
          label: 'Население (млн)',
          data: [13.1, 5.6, 1.6, 1.5, 1.3, 1.2]
        }]
      }
    });

    new Chart(document.getElementById('compareChart'), {
      type: 'bar',
      data: {
        labels: ['Москва', 'Кемь', 'Чекалин'],
        datasets: [{
          label: 'Население (тыс.)',
          data: [13100, 10, 0.84]
        }]
      }
    });
  </script>

  <!-- РЕАЛЬНЫЙ API -->
  <script>
    async function loadRealAPI() {
      try {
        const response = await fetch('https://restcountries.com/v3.1/name/russia');
        const data = await response.json();

        const population = data[0].population;
        const populationMillions = (population / 1_000_000).toFixed(1);

        document.getElementById('russiaPopulation').textContent =
          populationMillions + ' млн человек';
      } catch (error) {
        document.getElementById('russiaPopulation').textContent =
          'Ошибка загрузки';
        console.error(error);
      }
    }

    loadRealAPI();
  </script>

</body>
</html>
