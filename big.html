<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Крупные города</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <aside class="sidebar">
    <h2>
  <a href="index.html" class="russia-btn">
    <span class="icon">⭐</span>
    Россия
  </a>
</h2>

    <ul>
      <li><a href="overview.html">Обзор</a></li>
      <li class="active"><a href="big.html">Крупные города</a></li>
      <li><a href="small.html">Малые города</a></li>
    </ul>
  </aside>

  <main class="dashboard">
    <header>
      <h1>Крупные города России</h1>
      <p>Города-миллионники</p>
    </header>

    <section class="charts">
      <div class="chart-box">
        <h3>Население городов</h3>
        <canvas id="bigCitiesChart"></canvas>
      </div>
    </section>
  </main>

  <script>
    new Chart(document.getElementById('bigCitiesChart'), {
      type: 'bar',
      data: {
        labels: ['Москва', 'СПб', 'Новосибирск', 'Екатеринбург', 'Казань'],
        datasets: [{
          label: 'Население (млн)',
          data: [13.1, 5.6, 1.6, 1.5, 1.3]
        }]
      }
    });
  </script>
</body>
</html>
